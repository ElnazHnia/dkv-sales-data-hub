version: 2

models:
  - name: fct_sales
    description: "Sales fact table, one row per order. Revenue is invoiced, non-test, in EUR, tax excluded, credit notes negative."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: order_type
        tests:
          - accepted_values:
              values: ['Standard_Order', 'Credit_Note']