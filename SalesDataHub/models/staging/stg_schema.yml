version: 2

sources:
  - name: sales_raw
    description: "Raw source tables for the DKV Sales Data Hub case study."
    database: DKV_SALES_HUB
    schema: RAW
    tables:
      - name: RAW_CUSTOMERS
        description: "Customer master data with historical SCD2 records."
      - name: RAW_SALES_ORDERS
        description: "Sales order header records."
      - name: RAW_PRODUCTS_CONTRACTS
        description: "Product and contract master data."
      - name: RAW_SALES_TARGETS
        description: "Monthly sales targets with version and approval metadata."

models:
  - name: stg_sales__customers
    description: "Cleaned customer records with historical versions preserved."
    columns:
      - name: customer_raw_row_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: country_code
        description: "Customer country."
        tests:
          - not_null
          - accepted_values:
              values: ['DE', 'ES', 'FR', 'IT', 'NL', 'PL']
      - name: customer_segment
        tests:
          - not_null
          - accepted_values:
              values: ['Enterprise', 'Mid-Market', 'SMB', 'Strategic']
      - name: md_change_reason
        tests:
          - accepted_values:
              values: ['Active - Initial Load', 'Active - Segment Update', 'SCD2 Closed']
      - name: is_internal_test_account
        tests:
          - not_null
          
  - name: stg_sales__orders
    description: "Cleaned sales orders with technical duplicates removed."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['Invoiced', 'Completed', 'Pending_Approval', 'Cancelled', 'Internal_Test']
      - name: order_type
        tests:
          - not_null
          - accepted_values:
              values: ['Standard_Order', 'Credit_Note']
      - name: currency
        tests:
          - not_null
          - accepted_values:
              values: ['EUR', 'PLN']
      - name: sales_channel
        tests:
          - not_null
          - accepted_values:
              values: ['Direct Sales', 'Inside Sales', 'Digital Self-Service']

  - name: stg_sales__products
    description: "Cleaned product and contract records."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_category
        tests:
          - not_null
          - accepted_values:
              values: ['Core Subscription', 'Analytics & Add-Ons', 'Hardware & Equipment', 'Transaction Service']

  - name: stg_sales__targets
    description: "Monthly sales targets preserving all target versions."
    columns:
      - name: target_row_id
        tests:
          - not_null
          - unique
      - name: country_code
        tests:
          - not_null
          - accepted_values:
              values: ['DE', 'ES', 'FR', 'IT', 'NL', 'PL']
      - name: target_version
        tests:
          - not_null
          - accepted_values:
              values: ['v1_Draft', 'v2_Approved']