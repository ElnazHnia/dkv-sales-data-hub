version: 2

data_tests:
  - name: assert_one_first_order_per_customer
    description: >
      Each customer must have exactly one "first real order" (rn_real_order = 1).
      This keeps the new-customer count correct: a customer is counted as new
      once, in the month of their first order. The test returns any customer
      with more than one first order. No rows returned means the test passes.

  - name: assert_revenue_ties_to_source
    description: >
      Reconciliation check. Total net revenue in fct_sales must equal the revenue
      recalculated from the staging tables (invoiced orders, test accounts
      excluded, credit notes negative, converted to EUR). The test returns a row
      when the difference is larger than 0.01 EUR, which means a join or filter
      lost or duplicated orders. No rows returned means the test passes.