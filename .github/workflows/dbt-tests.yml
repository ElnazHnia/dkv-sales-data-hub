
name: DKV dbt CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  dbt-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true

      - name: Test Snowflake connection
        run: snow connection test -x

      # Deploy a separate test dbt project object here.
      # Then execute:
      # snow dbt execute -x YOUR_TEST_PROJECT build --target dev
